<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VAHABA GPS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin="">
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <div>
        <h1>VAHABA GPS</h1>
        <p>מערכת איתור — כרגע מיקום משוער לפי רשת/IP</p>
      </div>
      <div class="status">
        <span id="statusDot" class="dot warn"></span>
        <span id="statusText">ממתין לנתונים</span>
      </div>
    </header>

    <section class="layout">
      <div class="card map-card">
        <div id="map"></div>
      </div>

      <aside class="card side">
        <h2>מיקום אחרון</h2>

        <div class="field">
          <span>מזהה התקן</span>
          <strong id="device">—</strong>
        </div>

        <div class="field">
          <span>מיקום משוער</span>
          <strong id="place">—</strong>
        </div>

        <div class="two">
          <div class="field">
            <span>Latitude</span>
            <strong id="lat">—</strong>
          </div>
          <div class="field">
            <span>Longitude</span>
            <strong id="lon">—</strong>
          </div>
        </div>

        <div class="field">
          <span>Wi‑Fi</span>
          <strong id="ssid">—</strong>
          <small id="rssi"></small>
        </div>

        <div class="field">
          <span>מקור</span>
          <strong id="source">—</strong>
        </div>

        <div class="field">
          <span>עדכון אחרון</span>
          <strong id="updated">—</strong>
        </div>

        <button id="refreshBtn" type="button">רענן עכשיו</button>
      </aside>
    </section>

    <section class="card history-card">
      <div class="history-head">
        <h2>היסטוריית דיווחים</h2>
        <span id="countText">0 דיווחים</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>זמן</th>
              <th>התקן</th>
              <th>עיר</th>
              <th>Lat</th>
              <th>Lon</th>
              <th>SSID</th>
              <th>RSSI</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
        <div id="emptyState" class="empty">עדיין לא התקבלו דיווחים</div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
