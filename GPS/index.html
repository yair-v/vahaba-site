<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VAHABA GPS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html,body,#map{height:100%;margin:0}
    body{font-family:Arial,sans-serif;background:#111}
    #map{height:100%;width:100%}
    .panel{
      position:fixed;z-index:1000;top:12px;right:12px;
      background:rgba(255,255,255,.96);padding:12px 14px;border-radius:12px;
      box-shadow:0 4px 18px rgba(0,0,0,.25);min-width:230px
    }
    .title{font-weight:700;margin-bottom:8px}
    .status{font-size:14px;margin-bottom:6px}
    .coords{direction:ltr;text-align:left;font-family:monospace}
  </style>
</head>
<body>
  <div class="panel">
    <div class="title">VAHABA GPS</div>
    <div id="status" class="status">ממתין למיקום...</div>
    <div id="coords" class="coords">LAT: --<br>LON: --</div>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_URL = "https://portal.org.il/gps/location.php";

    const map = L.map('map').setView([31.8,34.9],8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19,
      attribution:'&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marker = null;
    let firstFix = true;

    async function updateLocation(){
      try{
        const r = await fetch(API_URL + "?t=" + Date.now(), {cache:"no-store"});
        const d = await r.json();

        if(!d.ok){
          document.getElementById("status").textContent = "אין עדיין מיקום";
          return;
        }

        const lat = Number(d.lat);
        const lon = Number(d.lon);

        document.getElementById("coords").innerHTML =
          "LAT: " + lat.toFixed(6) + "<br>LON: " + lon.toFixed(6);

        if(d.updated){
          const dt = new Date(d.updated * 1000);
          document.getElementById("status").textContent =
            "עודכן: " + dt.toLocaleString("he-IL");
        }else{
          document.getElementById("status").textContent = "מיקום התקבל";
        }

        if(!marker){
          marker = L.marker([lat,lon]).addTo(map);
        }else{
          marker.setLatLng([lat,lon]);
        }

        if(firstFix){
          map.setView([lat,lon],15);
          firstFix = false;
        }
      }catch(e){
        console.error(e);
        document.getElementById("status").textContent = "שגיאה בקבלת המיקום";
      }
    }

    updateLocation();
    setInterval(updateLocation,5000);
  </script>
</body>
</html>
